# Local Postgres for development and tests. Published on host port 5433 so it
# doesn't clash with a Postgres already running on your machine.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: stackboard
      POSTGRES_PASSWORD: stackboard
      POSTGRES_DB: stackboard
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
